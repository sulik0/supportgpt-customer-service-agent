name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Compile
        run: python -m compileall -q src scripts tests

      - name: Run full backend test suite
        env:
          APP_ENV: testing
          LLM_PROVIDER: mock
          OTEL_ENABLED: "false"
          QWEN3_GUARD_ENABLED: "false"
        run: python -m pytest -q

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Test frontend filters
        working-directory: frontend
        run: npm test

  tool-governance-postgres-drill:
    name: PostgreSQL Tool Governance Fault Drill
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: supportgpt
          POSTGRES_PASSWORD: isolated-ci-password
          POSTGRES_DB: supportgpt_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supportgpt -d supportgpt_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements/test.txt
      - name: Run isolated multi-process fault drill
        env:
          TOOL_DRILL_DATABASE_URL: postgresql+asyncpg://supportgpt:isolated-ci-password@127.0.0.1:5432/supportgpt_drill
        run: python scripts/run_postgres_tool_drill.py --confirm-isolated-database --report evaluation/reports/ci_tool_drill/postgres.json
      - name: Upload drill report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-tool-drill-${{ github.run_id }}
          path: evaluation/reports/ci_tool_drill/
          if-no-files-found: warn
          retention-days: 14

  agent-quality-gate:
    name: Agent PR Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements/base.txt
            requirements/test.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/test.txt

      - name: Replay fixed 100-case Baseline with Mock Provider
        env:
          GIT_COMMIT_SHA: ${{ github.sha }}
        run: |
          python scripts/run_ci_quality_gate.py \
            --output-dir evaluation/reports/ci_quality_gate

      - name: Verify paired PromptOps experiment with Mock Provider
        run: |
          python scripts/promptops.py --registry evaluation/reports/ci_quality_gate/promptops \
            evaluate --bundle default --environment staging --mock

      - name: Upload quality-gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-pr-quality-gate-${{ github.run_id }}
          path: evaluation/reports/ci_quality_gate/
          if-no-files-found: error
          retention-days: 14

  container-build:
    name: Container Build
    needs: [backend-tests, frontend-build, agent-quality-gate, tool-governance-postgres-drill]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify production image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/Dockerfile
          push: false
          tags: supportgpt-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
