services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/supportgpt
      - LANGGRAPH_CHECKPOINT_ENABLED=true
      - TOOL_POLICY_VERSION=${TOOL_POLICY_VERSION:-tool-policy-v2.2}
      - TOOL_ACTION_ENCRYPTION_KEY=${TOOL_ACTION_ENCRYPTION_KEY:?TOOL_ACTION_ENCRYPTION_KEY is required}
      - TOOL_OUTBOX_WORKER_ENABLED=${TOOL_OUTBOX_WORKER_ENABLED:-true}
      - TOOL_OUTBOX_LEASE_SECONDS=${TOOL_OUTBOX_LEASE_SECONDS:-30}
      - TOOL_OUTBOX_MAX_ATTEMPTS=${TOOL_OUTBOX_MAX_ATTEMPTS:-5}
      - TOOL_OUTBOX_RETRY_BASE_SECONDS=${TOOL_OUTBOX_RETRY_BASE_SECONDS:-1}
      - TOOL_OUTBOX_RETRY_MAX_SECONDS=${TOOL_OUTBOX_RETRY_MAX_SECONDS:-60}
      - TOOL_RECONCILIATION_DELAY_SECONDS=${TOOL_RECONCILIATION_DELAY_SECONDS:-2}
      - REDIS_URL=redis://cache:6379/0
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - PROMPT_REGISTRY_DIR=/app/promptops
      - PROMPT_ENVIRONMENT=${PROMPT_ENVIRONMENT:-production}
      - PROMPT_BUNDLE_ID=${PROMPT_BUNDLE_ID:-}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-mock-support-v1}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_FAST_MODEL_NAME=${LLM_FAST_MODEL_NAME:-}
      - LLM_FAST_BASE_URL=${LLM_FAST_BASE_URL:-}
      - LLM_FAST_API_KEY=${LLM_FAST_API_KEY:-}
      - LLM_ANALYZER_MODEL_NAME=${LLM_ANALYZER_MODEL_NAME:-}
      - LLM_QA_MODEL_NAME=${LLM_QA_MODEL_NAME:-}
      - LLM_RESOLVER_MAX_TOKENS=${LLM_RESOLVER_MAX_TOKENS:-320}
      - LLM_QA_MAX_TOKENS=${LLM_QA_MAX_TOKENS:-96}
      - LLM_QA_MAX_CONTEXT_CHARS=${LLM_QA_MAX_CONTEXT_CHARS:-4000}
      - DECISION_PROVIDER=${DECISION_PROVIDER:-disabled}
      - JEV_API_KEY=${JEV_API_KEY:-}
      - JEV_BASE_URL=${JEV_BASE_URL:-https://api.typesafe.ai}
      - JEV_MODEL=${JEV_MODEL:-jev-1.13.0}
      - JEV_TIMEOUT_SECONDS=${JEV_TIMEOUT_SECONDS:-3}
      - JEV_MAX_RETRIES=${JEV_MAX_RETRIES:-0}
      - APP_ENV=production
      - DEBUG=false
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - STAFF_SELF_REGISTRATION_ENABLED=false
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      - TRUST_PROXY_HEADERS=${TRUST_PROXY_HEADERS:-false}
      - PUBLIC_DEMO_ISOLATION_ENABLED=true
      - PUBLIC_DEMO_PROFILE_IDS=${PUBLIC_DEMO_PROFILE_IDS:-cust_101,cust_102,cust_103}
      - PUBLIC_VISITOR_SECRET=${PUBLIC_VISITOR_SECRET:?PUBLIC_VISITOR_SECRET is required}
      - PUBLIC_RATE_LIMIT_ENABLED=true
      - PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE=${PUBLIC_CHAT_RATE_LIMIT_PER_MINUTE:-5}
      - PUBLIC_CHAT_RATE_LIMIT_PER_DAY=${PUBLIC_CHAT_RATE_LIMIT_PER_DAY:-50}
      - PUBLIC_READ_RATE_LIMIT_PER_MINUTE=${PUBLIC_READ_RATE_LIMIT_PER_MINUTE:-30}
      - VECTOR_DB_PERSIST_DIR=/app/chromadb_store/0.5
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=supportgpt-backend
      - OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://otel-collector:4318/v1/traces
      - OTEL_EXPORTER_OTLP_METRICS_ENDPOINT=http://otel-collector:4318/v1/metrics
      - OTEL_EXPORTER_PREFLIGHT_ENABLED=false
      - LANGSMITH_CAPTURE_LLM_CONTENT=${LANGSMITH_CAPTURE_LLM_CONTENT:-true}
      - LANGSMITH_LLM_CONTENT_MAX_CHARS=${LANGSMITH_LLM_CONTENT_MAX_CHARS:-50000}
    volumes:
      - chromadb-data:/app/chromadb_store
      - ../.runtime/promptops:/app/promptops
    depends_on:
      - db
      - cache
      - otel-collector

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=supportgpt
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.45.0
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    environment:
      - OTEL_COLLECTOR_LANGSMITH_API_KEY=${OTEL_COLLECTOR_LANGSMITH_API_KEY:-}
      - OTEL_COLLECTOR_LANGSMITH_PROJECT=${OTEL_COLLECTOR_LANGSMITH_PROJECT:-supportgpt-enterprise}
      - OTEL_COLLECTOR_LANGSMITH_ENDPOINT=${OTEL_COLLECTOR_LANGSMITH_ENDPOINT:-https://api.smith.langchain.com/otel}
    volumes:
      - ../monitoring/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
      - "8889:8889"

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/supportgpt.json:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pg-data:
  chromadb-data:
  grafana-data:
