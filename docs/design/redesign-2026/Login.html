<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>员工登录</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4338CA}a:hover{color:#3730A3}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 900px; font-family: Inter, 'Noto Sans SC', 'PingFang SC', sans-serif; color: #0F172A; font-size: 14px; background: #FFFFFF">

  <section style="flex: 1 1 420px; background: #0E1325; color: #C7CDDB; padding: 48px 56px; display: flex; flex-direction: column; gap: 40px; box-sizing: border-box">
    <div style="display: flex; align-items: center; gap: 10px">
      <div style="width: 36px; height: 36px; border-radius: 10px; background: #4F46E5; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      </div>
      <span style="color: #FFFFFF; font-weight: 600; font-size: 17px">SupportGPT</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; max-width: 480px">
      <h2 style="margin: 0; color: #FFFFFF; font-size: 34px; line-height: 1.3; font-weight: 600">Agent 先处理，<br>人工把关关键一步。</h2>
      <p style="margin: 0; line-height: 1.8; color: #AEB5C8">涉及订单、退款和账户的操作，都会在这里等待员工确认。每一次运行都有完整轨迹可查。</p>
      <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <li style="display: flex; align-items: center; gap: 10px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #818CF8"></span>人工处理台：审批回复与工具调用</li>
        <li style="display: flex; align-items: center; gap: 10px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #818CF8"></span>运行监控：节点、耗时与 Token</li>
        <li style="display: flex; align-items: center; gap: 10px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #818CF8"></span>资源管理：工具、Prompt 与知识库</li>
      </ul>
    </div>
    <span style="font-size: 12px; color: #8891A7">员工账号由管理员创建，不开放公开注册。</span>
  </section>

  <section style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: 48px 24px; box-sizing: border-box; background: #F6F7F9">
    <form style="width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; background: #FFFFFF; border: 1px solid #E4E7EC; border-radius: 16px; padding: 32px; box-sizing: border-box; box-shadow: 0 12px 32px -12px rgba(16, 24, 40, 0.12)">
      <a href="#" style="font-size: 13px; color: #475467; text-decoration: none">← 返回用户咨询</a>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600">登录员工后台</h1>
        <span style="color: #475467">使用你的员工账号继续</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="u" style="font-size: 13px; font-weight: 500; color: #344054">用户名</label>
        <input id="u" autocomplete="username" style="height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-size: 14px">
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <label for="p" style="font-size: 13px; font-weight: 500; color: #344054">密码</label>
        <input id="p" type="password" autocomplete="current-password" style="height: 44px; padding: 0 12px; border: 1px solid #D0D5DD; border-radius: 8px; font: inherit; font-size: 14px">
      </div>
      <button type="submit" style="height: 44px; border: 0; border-radius: 8px; background: #4338CA; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">登录</button>
      <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #475467">
        <span style="width: 8px; height: 8px; border-radius: 4px; background: #12B76A"></span>
        服务连接正常
      </div>
    </form>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
